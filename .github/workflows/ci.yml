name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: python3 scripts/dependency_licenses.py
      - run: python3 -B -m unittest discover -s deploy/managed
      - run: sudo apt-get update && sudo apt-get install -y openssh-server python3-paramiko
      - name: 使用隔离的 Nginx 验证 SSH 文件编辑与重载
        run: |
          mkdir -p .local/nginx-test
          cd .local/nginx-test
          apt-get download nginx
          dpkg-deb -x nginx_*.deb unpacked
          cd ../..
          TEST_NGINX="$PWD/.local/nginx-test/unpacked/usr/sbin/nginx" python3 -B -m unittest discover -s deploy/ssh
      - run: cargo +stable build --locked -p asterion-server -p asterion-collector
      - run: /usr/bin/python3 -B scripts/test_ssh.py
      - name: 通过面板任务部署并验证真实 systemd 服务
        run: TEST_SYSTEM_DEPLOY=1 /usr/bin/python3 -B scripts/test_ssh.py

  local-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 构建本机面板
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p asterion-server -p asterion-collector
          npm --prefix web ci
          npm --prefix web run build
      - name: 为发布包构建 ARM64 采集器
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add --toolchain stable aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          cargo +stable build --locked --release -p asterion-collector --target aarch64-unknown-linux-gnu
          install -D -m 0755 target/aarch64-unknown-linux-gnu/release/asterion-collector target/release/collectors/aarch64/asterion-collector
      - name: 验证运行包解压、登录与重启
        run: |
          bash scripts/package-local.sh
          python3 -B scripts/test_local_package.py .local/asterion-local-linux-x86_64.tar.gz
          if [[ -d target/release/collectors/aarch64 ]]; then
            tar -tzf .local/asterion-local-linux-x86_64.tar.gz collectors/aarch64/asterion-collector
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: asterion-local-linux-x86_64
          path: .local/asterion-local-linux-x86_64.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
