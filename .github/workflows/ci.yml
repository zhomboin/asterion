name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: python3 scripts/dependency_licenses.py
      - run: python3 -B -m unittest discover -s deploy/managed
      - run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - run: /usr/bin/python3 -B -m unittest discover -s deploy/ssh-enrollment

  center-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          bash -n deploy/install-center.sh
          bash -n deploy/build-release.sh
          /usr/bin/python3 -B -m unittest discover -s deploy/center -v
      - name: root 从源码构建并进入安装向导
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
          sudo -H env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" expect <<'TCL'
          set timeout 600
          spawn bash deploy/install-center.sh
          expect {
              "未找到发布包，正在从源码构建。" {}
              eof { exit 1 }
              timeout { exit 1 }
          }
          expect {
              "面板域名（已设 DNS A 记录）：" { send "\004" }
              eof { exit 1 }
              timeout { exit 1 }
          }
          expect eof
          set result [wait]
          exit [expr {[lindex $result 2] != 0 || [lindex $result 3] != 1}]
          TCL
      - name: 在本机 ACME 服务上验收 HTTP 签发、续期和面板鉴权
        run: bash .github/workflows/check_center_acme.sh
      - name: 查看安装服务日志
        if: failure()
        run: sudo journalctl --no-pager -o short-precise -u asterion-server.service -u asterion-agent.service -n 100

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
