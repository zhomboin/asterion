name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: python3 scripts/dependency_licenses.py
      - run: python3 -B -m unittest discover -s deploy/managed
      - run: python3 -B -m unittest discover -s deploy/ssh
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo +stable build --locked -p asterion-server
      - run: python3 -B scripts/test_ssh.py

  local-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 构建本机面板
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release -p asterion-server
          npm --prefix web ci
          npm --prefix web run build
      - name: 验证运行包解压、登录与重启
        run: |
          bash scripts/package-local.sh
          python3 -B scripts/test_local_package.py .local/asterion-local-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: asterion-local-linux-x86_64
          path: .local/asterion-local-linux-x86_64.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
