name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace
      - run: python3 scripts/dependency_licenses.py
      - run: python3 -B -m unittest discover -s deploy/managed
      - run: sudo apt-get update && sudo apt-get install -y python3-paramiko
      - run: /usr/bin/python3 -B -m unittest discover -s deploy/ssh-enrollment

  center-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          bash -n deploy/install-center.sh
          bash -n deploy/build-release.sh
          /usr/bin/python3 -B -m unittest discover -s deploy/center -v
      - run: cargo +stable build --locked --bin asterion-server --bin asterion-agent
      - run: sudo --preserve-env=GITHUB_ACTIONS /usr/bin/python3 -I -B .github/workflows/check_center_install.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
