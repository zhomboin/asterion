[package]
name = "asterion-server"
version.workspace = true
edition.workspace = true

[features]
default = ["openssh"]
openssh = []

[[bin]]
name = "asterion-server"
path = "src/main.rs"
required-features = ["openssh"]

[dependencies]
anyhow = "1"
base64 = "0.22"
argon2 = { version = "0.5.3", features = ["std"] }
asterion-protocol.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = "0.8"
getrandom = "0.3"
libc = "0.2"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
