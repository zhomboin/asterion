[package]
name = "asterion-agent"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
asterion-protocol.workspace = true
asterion-collector = { path = "../asterion-collector" }
asterion-executor = { path = "../asterion-executor" }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.2"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
